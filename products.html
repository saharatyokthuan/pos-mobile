<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS-MOBILE — สินค้า</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="style-pos.css">
</head>
<body data-page="products">
<header class="header-app">
  <div class="header-left">
    <button class="header-btn" id="hamburger-btn" onclick="openMenu()" aria-label="เปิดเมนู" aria-expanded="false">
      ☰
    </button>
  </div>
  <div class="header-center" onclick="navigateFromMenu('pos')" role="button" aria-label="กลับหน้าแรก">
    <h1 class="header-title">POS-MOBILE</h1>
    <p class="header-subtitle" id="header-subtitle"></p>
  </div>
  <div class="header-right">
   <button class="header-btn" id="setting-btn" onclick="openSetting()" aria-label="เปิดการตั้งค่า"aria-expanded="false">
    ⚙️
   </button>
  </div>
</header>

<!-- ── SIDE MENU ─────────────────────────────── -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">☰ เมนู</span>
    <button class="btn-icon" onclick="closeMenu()" aria-label="ปิดเมนู">✕</button>
  </div>
  <nav class="sidebar-nav">
    <button class="sidebar-link" onclick="navigateFromMenu('pos')">🛒 ขายสินค้า</button>
    <button class="sidebar-link" onclick="navigateFromMenu('products')">📦 สินค้า</button>
    <button class="sidebar-link" onclick="navigateFromMenu('purchase')">🚚 สั่งซื้อ</button>
    <button class="sidebar-link" onclick="navigateFromMenu('debt')">💳 ลูกหนี้</button>
    <button class="sidebar-link" onclick="navigateFromMenu('reports')">📊 รายงาน</button>
    <button class="sidebar-link" onclick="navigateFromMenu('more')">⚙️ เพิ่มเติม / ตั้งค่า</button>
  </nav>
  <div class="sidebar-divider"></div>
  <nav class="sidebar-nav">
    <button class="sidebar-link" onclick="closeMenu();openExpense()">💸 บันทึกรายจ่าย</button>
    <button class="sidebar-link" onclick="closeMenu();showSubPage('stock-adjust')">⚖️ ปรับสต๊อก</button>
    <button class="sidebar-link" onclick="closeMenu();openHoldBillsPage()">🅿️ บิลพัก</button>
    <button class="sidebar-link" onclick="closeMenu();exportBackupJSON()">💾 สำรองข้อมูลทั้งหมด</button>
  </nav>
</aside>

<!-- ── TOP BAR ─────────────────────────────── -->
<div id="topbar">
  <span id="topbar-title"> 📦 สินค้า</span>
  <span class="badge badge-teal" id="pos-bill-no" style="display:none">—</span>
  <button class="btn btn-secondary btn-sm" id="topbar-action" style="display:none"></button>
</div>

<!-- ── PAGE CONTAINER ──────────────────────── -->
<div id="page-container">

  <div class="page active" id="page-products">
    <div class="page-body">
      <div class="filter-row">
        <input type="text" id="prod-search" placeholder="ค้นหา..." oninput="renderProducts()">
        <select id="prod-cat-filter" onchange="renderProducts()">
          <option value="">ทุกหมวด</option>
        </select>
        <select id="prod-stock-filter" onchange="renderProducts()">
          <option value="">สต๊อกทั้งหมด</option>
          <option value="available">มีสต๊อก (ไม่หมด)</option>
          <option value="low">ใกล้หมด</option>
          <option value="out">หมดแล้ว</option>
        </select>
      </div>
      <div id="prod-list"></div>
    </div>
  </div>

</div><!-- end page-container -->

<!-- ── CART FAB ──────────────────────────────── -->
<button id="cart-fab" onclick="openCartSheet()">
  🛒
  <span id="cart-count-badge">0</span>
</button>

<!-- ── BOTTOM NAV ─────────────────────────────── -->
<nav id="bottom-nav">
  <button class="nav-item" onclick="showPage('pos')" id="nav-pos">
    <span class="nav-icon">🛒</span>
    <span>ขาย</span>
  </button>
  <button class="nav-item" onclick="showPage('products')" id="nav-products">
    <span class="nav-icon">📦</span>
    <span>สินค้า</span>
    <span class="nav-badge" id="nav-alert-badge"></span>
  </button>
  <button class="nav-item" onclick="showPage('debt')" id="nav-debt">
    <span class="nav-icon">💳</span>
    <span>ลูกหนี้</span>
  </button>
  <button class="nav-item" onclick="showPage('reports')" id="nav-reports">
    <span class="nav-icon">📊</span>
    <span>รายงาน</span>
  </button>
  <button class="nav-item" onclick="showPage('more')" id="nav-more">
    <span class="nav-icon">☰</span>
    <span>เพิ่มเติม</span>
  </button>
</nav>

<!-- ── TOAST ─────────────────────────────────── -->
<div id="toast-container"></div>

<div class="modal-overlay" id="modal-product" onclick="if(event.target===this)closeModal('modal-product')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="prod-modal-title">➕ เพิ่มสินค้า</div>
    <div class="form-group"><label>รหัสสินค้า (Master Product ID) *</label><input type="text" id="pm-product_id" placeholder="เช่น 4111505" oninput="autoFillCategory()"></div>
    <div class="form-group">
      <label>บาร์โค้ด (Barcode) *</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="pm-barcode" placeholder="เช่น 8859733221136" inputmode="numeric" style="flex:1">
        <button type="button" class="btn btn-secondary" onclick="scanBarcodeToProductForm()" title="สแกนบาร์โค้ด (กล้องสด)">📷</button>
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('pm-photo-input').click()" title="ถ่าย/เลือกรูปบาร์โค้ด">🖼️</button>
        <input type="file" id="pm-photo-input" accept="image/*" capture="environment" style="display:none" onchange="scanBarcodeFromPhotoToProductForm(event)">
      </div>
    </div>
    <div class="form-group"><label>ชื่อสินค้า *</label><input type="text" id="pm-name"></div>
    <div class="form-group"><label>หมวดหมู่ (Auto-fill ตามรหัส)</label>
      <input type="text" id="pm-category" placeholder="จะถูกเติมอัตโนมัติตามรหัสสินค้า" readonly>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">💡 หมวดหมู่จะถูกเติมอัตโนมัติเมื่อกรอกรหัสสินค้า ตามที่ตั้งค่าในหน้า "เพิ่มเติม"</div>
    </div>
    <div class="form-group"><label>ราคาขาย (บาท) *</label><input type="number" id="pm-price" inputmode="decimal" step="0.01" placeholder="0.00"></div>
    <div class="form-group"><label>ราคาทุน (บาท)</label><input type="number" id="pm-cost" inputmode="decimal" step="0.01"></div>
    <div class="form-group"><label>สต๊อก</label><input type="number" id="pm-stock" inputmode="numeric"></div>
    <div class="form-group"><label>แจ้งเตือนสต๊อกต่ำกว่า</label><input type="number" id="pm-min-stock" inputmode="numeric"></div>
    <div class="form-group"><label>วันหมดอายุ</label><input type="date" id="pm-expiry"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-product')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveProduct()">💾 บันทึก</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-stock-adjust" onclick="if(event.target===this)closeModal('modal-stock-adjust')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">⚖️ ปรับสต๊อก</div>
    <div class="form-group"><input type="text" id="adj-search" placeholder="ค้นหา..." oninput="renderAdjList()"></div>
    <div id="adj-list" style="max-height:50vh;overflow-y:auto"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-stock-adjust')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveStockAdjust()">⚖️ บันทึก</button>
    </div>
  </div>
</div>
<script src="script-pos.js"></script>
</body>
</html>
