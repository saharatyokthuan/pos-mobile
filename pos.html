<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS-MOBILE — ขายสินค้า</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="style-pos.css">
</head>
<body data-page="pos">
<header class="header-app">
  <div class="header-left">
    <button class="header-btn" id="hamburger-btn" onclick="openMenu()" aria-label="เปิดเมนู" aria-expanded="false">
      ☰
    </button>
  </div>
  <div class="header-center" onclick="navigateFromMenu('pos')" role="button" aria-label="กลับหน้าแรก">
    <h1 class="header-title">POS-MOBILE</h1>
    <p class="header-subtitle" id="header-subtitle"></p>
  </div>
  <div class="header-right">
   <button class="header-btn" id="setting-btn" onclick="openSetting()" aria-label="เปิดการตั้งค่า"aria-expanded="false">
    ⚙️
   </button>
  </div>
</header>

<!-- ── SIDE MENU ─────────────────────────────── -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">☰ เมนู</span>
    <button class="btn-icon" onclick="closeMenu()" aria-label="ปิดเมนู">✕</button>
  </div>
  <nav class="sidebar-nav">
    <button class="sidebar-link" onclick="navigateFromMenu('pos')">🛒 ขายสินค้า</button>
    <button class="sidebar-link" onclick="navigateFromMenu('products')">📦 สินค้า</button>
    <button class="sidebar-link" onclick="navigateFromMenu('purchase')">🚚 สั่งซื้อ</button>
    <button class="sidebar-link" onclick="navigateFromMenu('debt')">💳 ลูกหนี้</button>
    <button class="sidebar-link" onclick="navigateFromMenu('reports')">📊 รายงาน</button>
    <button class="sidebar-link" onclick="navigateFromMenu('more')">⚙️ เพิ่มเติม / ตั้งค่า</button>
  </nav>
  <div class="sidebar-divider"></div>
  <nav class="sidebar-nav">
    <button class="sidebar-link" onclick="closeMenu();openExpense()">💸 บันทึกรายจ่าย</button>
    <button class="sidebar-link" onclick="closeMenu();showSubPage('stock-adjust')">⚖️ ปรับสต๊อก</button>
    <button class="sidebar-link" onclick="closeMenu();openHoldBillsPage()">🅿️ บิลพัก</button>
    <button class="sidebar-link" onclick="closeMenu();exportBackupJSON()">💾 สำรองข้อมูลทั้งหมด</button>
  </nav>
</aside>

<!-- ── TOP BAR ─────────────────────────────── -->
<div id="topbar">
  <span id="topbar-title"> 🛒 ขายสินค้า</span>
  <span class="badge badge-teal" id="pos-bill-no" style="display:none">—</span>
  <button class="btn btn-secondary btn-sm" id="topbar-action" style="display:none"></button>
</div>

<!-- ── PAGE CONTAINER ──────────────────────── -->
<div id="page-container">

  <div class="page active" id="page-pos">
    <div id="pos-search-bar">
      <div id="pos-search-wrap">
        <input type="text" id="pos-search-input" placeholder="ชื่อ, รหัสสินค้า หรือ Barcode" oninput="filterPosProducts()" onkeydown="if(event.key==='Enter')addFirstResult()">
        <button class="btn btn-secondary" id="pos-scan-btn" onclick="scanBarcode()" title="สแกนบาร์โค้ด (กล้องสด)">📷</button>
        <button class="btn btn-secondary" id="pos-photo-btn" onclick="document.getElementById('pos-photo-input').click()" title="ถ่าย/เลือกรูปบาร์โค้ด">🖼️</button>
        <input type="file" id="pos-photo-input" accept="image/*" capture="environment" style="display:none" onchange="scanBarcodeFromPhoto(event)">
      </div>
    </div>
    <div id="pos-cat-scroll"></div>
    <div id="pos-product-scroll">
      <div class="product-grid" id="pos-product-grid"></div>
    </div>
  </div>

</div><!-- end page-container -->

<!-- ── CART FAB ──────────────────────────────── -->
<button id="cart-fab" onclick="openCartSheet()">
  🛒
  <span id="cart-count-badge">0</span>
</button>

<!-- ── BOTTOM NAV ─────────────────────────────── -->
<nav id="bottom-nav">
  <button class="nav-item" onclick="showPage('pos')" id="nav-pos">
    <span class="nav-icon">🛒</span>
    <span>ขาย</span>
  </button>
  <button class="nav-item" onclick="showPage('products')" id="nav-products">
    <span class="nav-icon">📦</span>
    <span>สินค้า</span>
    <span class="nav-badge" id="nav-alert-badge"></span>
  </button>
  <button class="nav-item" onclick="showPage('debt')" id="nav-debt">
    <span class="nav-icon">💳</span>
    <span>ลูกหนี้</span>
  </button>
  <button class="nav-item" onclick="showPage('reports')" id="nav-reports">
    <span class="nav-icon">📊</span>
    <span>รายงาน</span>
  </button>
  <button class="nav-item" onclick="showPage('more')" id="nav-more">
    <span class="nav-icon">☰</span>
    <span>เพิ่มเติม</span>
  </button>
</nav>

<!-- ── TOAST ─────────────────────────────────── -->
<div id="toast-container"></div>

<div id="cart-sheet" onclick="if(event.target===this)closeCartSheet()">
  <div id="cart-panel">
    <div class="cart-header">
      <div class="modal-handle" style="margin:0"></div>
      <span class="cart-header-title">🧾 รายการ</span>
      <span class="badge badge-teal" id="cart-bill-badge">—</span>
      <button class="btn-icon" onclick="clearCart()" title="ล้าง">🗑️</button>
      <button class="btn-icon" onclick="closeCartSheet()">✕</button>
    </div>
    <div class="cart-items-list" id="cart-items-list"></div>
    <div class="cart-summary">
      <div class="sum-row"><span>รวม</span><span class="val" id="cs-subtotal">฿0.00</span></div>
      <div class="sum-discount-row">
        <span style="font-size:13px">ส่วนลด</span>
        <div class="disc-inputs">
          <input type="number" id="cs-discount-val" value="0" oninput="calcCart()" min="0">
          <select id="cs-discount-type" onchange="calcCart()">
            <option value="฿">฿</option>
            <option value="%">%</option>
          </select>
        </div>
      </div>
      <div class="sum-row"><span style="font-size:12px;color:var(--text-muted)">VAT 7%</span><span class="val text-muted" id="cs-vat" style="font-size:12px">฿0.00</span></div>
      <div class="sum-total-row"><span>ยอดรวม</span><span class="sum-total-val" id="cs-total">฿0.00</span></div>
      <div class="cart-btn-row">
        <button class="btn btn-secondary" onclick="addDebtSale()">💳 เชื่อ</button>
        <button class="btn btn-secondary btn-sm" onclick="holdCurrentCart()">📌 พัก</button>
        <button class="btn btn-primary" onclick="openPayment()" style="flex:2">💵 ชำระเงิน</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-payment" onclick="if(event.target===this)closeModal('modal-payment')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">💵 ชำระเงิน</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:13px;color:var(--text-muted)">ยอดรวม</span>
      <span style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--teal)" id="pay-total-display">฿0.00</span>
    </div>
    <div class="pay-type-row">
      <button class="pay-type-btn active" id="pay-cash-btn" onclick="setPayType('เงินสด')"><span class="pay-icon">💵</span>เงินสด</button>
      <button class="pay-type-btn" id="pay-transfer-btn" onclick="setPayType('โอน')"><span class="pay-icon">🏦</span>โอน</button>
      <button class="pay-type-btn" id="pay-card-btn" onclick="setPayType('บัตร')"><span class="pay-icon">💳</span>บัตร</button>
    </div>
    <!-- Cash section -->
    <div id="pay-cash-section">
      <div class="pay-display" id="pay-received-display">0</div>
      <div class="pay-change-row">ทอน: <span class="pay-change-val" id="pay-change-display">฿0.00</span></div>
      <div class="quick-cash-row">
        <button class="quick-cash-btn" onclick="quickCash(20)">+20</button>
        <button class="quick-cash-btn" onclick="quickCash(50)">+50</button>
        <button class="quick-cash-btn" onclick="quickCash(100)">+100</button>
        <button class="quick-cash-btn" onclick="quickCash(500)">+500</button>
        <button class="quick-cash-btn" onclick="quickCash(1000)">+1000</button>
      </div>
      <div class="payment-keypad">
        <button class="key-btn" onclick="keyPad('7')">7</button>
        <button class="key-btn" onclick="keyPad('8')">8</button>
        <button class="key-btn" onclick="keyPad('9')">9</button>
        <button class="key-btn" onclick="keyPad('4')">4</button>
        <button class="key-btn" onclick="keyPad('5')">5</button>
        <button class="key-btn" onclick="keyPad('6')">6</button>
        <button class="key-btn" onclick="keyPad('1')">1</button>
        <button class="key-btn" onclick="keyPad('2')">2</button>
        <button class="key-btn" onclick="keyPad('3')">3</button>
        <button class="key-btn" onclick="keyPad('.')">.</button>
        <button class="key-btn" onclick="keyPad('0')">0</button>
        <button class="key-btn" onclick="keyPad('00')">00</button>
        <button class="key-btn key-clear" onclick="keyPad('C')">C</button>
        <button class="key-btn key-back" onclick="keyPad('BACK')">⌫</button>
      </div>
      <button class="btn btn-primary btn-full key-enter-full" onclick="confirmPayment()">✅ ชำระ</button>
    </div>
    <!-- Transfer section -->
    <div id="pay-transfer-section" style="display:none">
      <div class="form-group"><label>ยอดโอน</label><input type="number" id="pay-transfer-amt" placeholder="0.00" inputmode="decimal"></div>
      <div class="form-group"><label>หมายเหตุ</label><input type="text" id="pay-transfer-note" placeholder="เลขที่รายการ..."></div>
      <button class="btn btn-primary btn-full" onclick="confirmPayment()">✅ ยืนยันการชำระ</button>
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-secondary btn-full" onclick="closeModal('modal-payment')">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-receipt" onclick="if(event.target===this)newBill()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🧾 ใบเสร็จ</div>
    <div id="receipt-content"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="printReceipt()">🖨️ พิมพ์</button>
      <button class="btn btn-primary" onclick="newBill()">➕ บิลใหม่</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-hold" onclick="if(event.target===this)closeModal('modal-hold')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📌 บิลพัก</div>
    <div id="hold-bills-list"></div>
    <div style="margin-top:12px"><button class="btn btn-secondary btn-full" onclick="closeModal('modal-hold')">ปิด</button></div>
  </div>
</div>
<script src="script-pos.js"></script>
</body>
</html>
